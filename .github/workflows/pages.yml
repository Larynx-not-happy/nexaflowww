name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages
        run: SITE_URL=https://larynx-not-happy.github.io npx vite build --config vite.config.pages.ts
        env:
          NODE_ENV: production

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r .output/public/* _site/
          cp _site/index.html _site/404.html
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://larynx-not-happy.github.io/sitemap.xml\n' > _site/robots.txt
          cat > _site/sitemap.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://larynx-not-happy.github.io/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url>
            <url><loc>https://larynx-not-happy.github.io/features</loc><changefreq>monthly</changefreq><priority>0.9</priority></url>
            <url><loc>https://larynx-not-happy.github.io/pricing</loc><changefreq>monthly</changefreq><priority>0.9</priority></url>
            <url><loc>https://larynx-not-happy.github.io/about</loc><changefreq>yearly</changefreq><priority>0.6</priority></url>
            <url><loc>https://larynx-not-happy.github.io/faq</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>
            <url><loc>https://larynx-not-happy.github.io/contact</loc><changefreq>yearly</changefreq><priority>0.7</priority></url>
            <url><loc>https://larynx-not-happy.github.io/privacy-policy</loc><changefreq>yearly</changefreq><priority>0.3</priority></url>
            <url><loc>https://larynx-not-happy.github.io/terms</loc><changefreq>yearly</changefreq><priority>0.3</priority></url>
          </urlset>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
